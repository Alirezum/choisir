[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choosier"
version = "0.2.0"
description = "This is a Random File(or Dir) choosier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
choosier = "choosier.cli:main"

[project.optional-dependencies]
ui = ["textual>=8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
